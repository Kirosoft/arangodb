[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deethoughtdb-port"
version = "0.1.0"
description = "DeethoughtDB backend port foundation (runtime + REST dispatch)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DeethoughtDB Team" }]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
