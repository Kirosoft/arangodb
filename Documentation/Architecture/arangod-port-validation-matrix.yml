purpose: >
  Machine-readable validation matrix for the arangod backend port. This file is
  the executable scope contract for deciding whether the port is valid.

scopeSources:
  - tests/tests.yml
  - tests/*.yml
  - tests/CMakeLists.txt
  - scripts/unittest
  - scripts/unittest.ps1
  - js/client/modules/@arangodb/testsuites/*.js

gates:
