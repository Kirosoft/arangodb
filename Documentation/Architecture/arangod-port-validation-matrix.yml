    name: backend-core
    blocking: true
    description: Must pass for backend functional validity.
  B:
    name: distributed-operational
    blocking: true
    description: Must pass for clustered/operational production readiness.
  C:
    name: deferred-excluded
    blocking: false
    description: Informational in this phase (AQL/V8/UI exclusion scope).

